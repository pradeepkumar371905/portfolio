<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Snake - Pradeep Kumar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top, #17243a, #070a11 55%, #020306);
}

/* MAIN BOX */

.container {
    width: 100%;
    max-width: 620px;

    padding: 24px;

    background: rgba(8, 13, 23, 0.95);

    border: 1px solid #263548;
    border-radius: 25px;

    box-shadow:
        0 0 45px rgba(0, 255, 200, 0.08);
}


/* START SCREEN */

#startScreen {
    text-align: center;
    padding: 45px 15px;
}

.created {
    color: #00ffc8;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

.name {
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 900;
    letter-spacing: 4px;

    background: linear-gradient(
        90deg,
        #00ffc8,
        #00aaff,
        #ffffff,
        #00ffc8
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.game-name {
    margin-top: 12px;
    margin-bottom: 35px;

    color: #8d99ac;
    font-size: 14px;
    letter-spacing: 2px;
}

.start-button {
    padding: 15px 38px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #00ffc8,
        #00aaff
    );

    color: #031016;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 25px rgba(0, 255, 200, 0.25);

    transition: 0.2s;
}

.start-button:hover {
    transform: translateY(-3px);
    box-shadow:
        0 0 35px rgba(0, 255, 200, 0.45);
}


/* GAME SCREEN */

#gameScreen {
    display: none;
}


/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.logo {
    font-size: 18px;
    font-weight: bold;
}

.logo span {
    color: #00ffc8;
}

.scores {
    display: flex;
    gap: 8px;
}

.score-box {
    min-width: 78px;

    padding: 8px 10px;

    text-align: center;

    background: #0b111b;

    border: 1px solid #263548;
    border-radius: 10px;
}

.score-box small {
    display: block;
    color: #738096;
    font-size: 9px;
}

.score-box strong {
    color: #00ffc8;
    font-size: 16px;
}


/* GAME BORDER */

.game-border {
    padding: 6px;

    border-radius: 20px;

    background: linear-gradient(
        135deg,
        #00ffc8,
        #0066ff,
        #ff1744,
        #00ffc8
    );

    background-size: 300% 300%;

    animation: borderMove 7s linear infinite;
}

@keyframes borderMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* CANVAS */

canvas {
    display: block;

    width: 100%;
    height: auto;

    border-radius: 15px;

    background-color: #050911;
}


/* GAME OVER */

#gameOver {
    display: none;

    position: fixed;
    inset: 0;

    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.75);

    z-index: 20;
}

.game-over-box {
    width: min(90%, 350px);

    padding: 30px;

    text-align: center;

    background: #0b111b;

    border: 1px solid #ff1744;

    border-radius: 20px;

    box-shadow: 0 0 35px rgba(255, 23, 68, 0.2);
}

.game-over-box h2 {
    color: #ff405f;
    font-size: 35px;
    margin-bottom: 12px;
}

.game-over-box p {
    color: #9ca8ba;
    margin-bottom: 20px;
}

.play-again {
    padding: 12px 25px;

    border: 1px solid #00ffc8;
    border-radius: 10px;

    background: transparent;

    color: #00ffc8;

    cursor: pointer;

    font-weight: bold;
}

.play-again:hover {
    background: #00ffc8;
    color: #031016;
}


/* MOBILE BUTTONS */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-top: 18px;
}

.middle-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.control {
    width: 50px;
    height: 44px;

    border: 1px solid #263548;
    border-radius: 10px;

    background: #0b111b;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

.control:hover {
    color: #00ffc8;
    border-color: #00ffc8;
}

.help {
    text-align: center;

    margin-top: 15px;

    color: #68758a;

    font-size: 12px;
    line-height: 1.6;
}

.footer {
    text-align: center;

    margin-top: 18px;

    color: #4f5c70;

    font-size: 10px;
    letter-spacing: 1px;
}


/* MOBILE */

@media (max-width: 500px) {

    .container {
        padding: 15px;
        border-radius: 18px;
    }

    #startScreen {
        padding: 35px 5px;
    }

    .name {
        font-size: 42px;
    }

    .score-box {
        min-width: 65px;
    }

    .control {
        width: 46px;
        height: 42px;
    }
}
</style>
</head>


<body>

<div class="container">


<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div class="created">
        CREATED BY
    </div>

    <div class="name">
        PRADEEP KUMAR
    </div>

    <div class="game-name">
        🐍 NEON SNAKE • DEVELOPER EDITION
    </div>

    <button
        class="start-button"
        id="startButton">

        ▶ START GAME

    </button>

</div>


<!-- =========================
     GAME SCREEN
========================= -->

<div id="gameScreen">

    <div class="header">

        <div class="logo">
            🐍 <span>NEON</span> SNAKE
        </div>

        <div class="scores">

            <div class="score-box">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="score-box">
                <small>BEST</small>
                <strong id="best">0</strong>
            </div>

        </div>

    </div>


    <!-- GAME BOARD -->

    <div class="game-border">

        <canvas
            id="gameCanvas"
            width="500"
            height="500">
        </canvas>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control"
            data-direction="LEFT">
            ◀
        </button>

        <div class="middle-controls">

            <button
                class="control"
                data-direction="UP">
                ▲
            </button>

            <button
                class="control"
                data-direction="DOWN">
                ▼
            </button>

        </div>

        <button
            class="control"
            data-direction="RIGHT">
            ▶
        </button>

    </div>


    <div class="help">
        Use Arrow Keys or the buttons to move the snake.
        <br>
        Eat the 🔴 red food and grow.
    </div>


    <div class="footer">
        PRADEEP KUMAR • B.TECH CSE • 2026
    </div>

</div>

</div>


<!-- GAME OVER -->

<div id="gameOver">

    <div class="game-over-box">

        <h2>
            GAME OVER
        </h2>

        <p>
            Your Score:
            <strong id="finalScore">0</strong>
        </p>

        <button
            class="play-again"
            id="restartButton">

            ↻ PLAY AGAIN

        </button>

    </div>

</div>


<script>

/* =====================================
   NEON SNAKE GAME
   Created By: Pradeep Kumar
===================================== */


/* CANVAS */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* SCREEN ELEMENTS */

const startScreen =
    document.getElementById("startScreen");

const gameScreen =
    document.getElementById("gameScreen");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const gameOver =
    document.getElementById("gameOver");

const scoreText =
    document.getElementById("score");

const bestText =
    document.getElementById("best");

const finalScore =
    document.getElementById("finalScore");


/* GAME SETTINGS */

const grid = 20;

const cells = 25;


/*
   SLOW SPEED

   Bigger number = slower snake.

   220 = comfortable speed.
*/

const startingSpeed = 220;

const minimumSpeed = 140;


/* GAME VARIABLES */

let snake = [];

let food = {};

let direction = "RIGHT";

let nextDirection = "RIGHT";

let score = 0;

let bestScore =
    Number(
        localStorage.getItem("neonSnakeBest")
    ) || 0;

let speed = startingSpeed;

let timer = null;

let running = false;


bestText.textContent =
    bestScore;


/* =========================
   START GAME
========================= */

startButton.addEventListener(
    "click",
    startGame
);


function startGame() {

    startScreen.style.display = "none";

    gameScreen.style.display = "block";

    newGame();
}


/* =========================
   NEW GAME
========================= */

function newGame() {

    clearInterval(timer);

    snake = [

        { x: 12, y: 12 },

        { x: 11, y: 12 },

        { x: 10, y: 12 }

    ];


    direction = "RIGHT";

    nextDirection = "RIGHT";

    score = 0;

    speed = startingSpeed;

    scoreText.textContent = score;

    gameOver.style.display = "none";

    createFood();

    running = true;

    timer = setInterval(
        gameStep,
        speed
    );

    draw();
}


/* =========================
   CREATE FOOD
========================= */

function createFood() {

    let positionOK = false;

    while (!positionOK) {

        food = {

            x: Math.floor(
                Math.random() * cells
            ),

            y: Math.floor(
                Math.random() * cells
            )

        };


        positionOK =
            !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );
    }
}


/* =========================
   GAME STEP
========================= */

function gameStep() {

    if (!running) {
        return;
    }


    direction = nextDirection;


    const head = {

        x: snake[0].x,

        y: snake[0].y

    };


    /* MOVE */

    if (direction === "UP") {
        head.y--;
    }

    if (direction === "DOWN") {
        head.y++;
    }

    if (direction === "LEFT") {
        head.x--;
    }

    if (direction === "RIGHT") {
        head.x++;
    }


    /* WALL COLLISION */

    if (

        head.x < 0 ||

        head.x >= cells ||

        head.y < 0 ||

        head.y >= cells

    ) {

        endGame();

        return;
    }


    /* BODY COLLISION */

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        endGame();

        return;
    }


    /* ADD HEAD */

    snake.unshift(head);


    /* FOOD */

    if (

        head.x === food.x &&

        head.y === food.y

    ) {

        score++;

        scoreText.textContent = score;


        /* HIGH SCORE */

        if (score > bestScore) {

            bestScore = score;

            bestText.textContent =
                bestScore;

            localStorage.setItem(
                "neonSnakeBest",
                bestScore
            );
        }


        createFood();


        /*
           SPEED INCREASE

           Every 5 points:
           220 → 210 → 200...
        */

        if (

            score % 5 === 0 &&

            speed > minimumSpeed

        ) {

            speed -= 10;

            clearInterval(timer);

            timer = setInterval(
                gameStep,
                speed
            );
        }

    } else {

        /* REMOVE TAIL */

        snake.pop();
    }


    draw();
}


/* =========================
   DRAW EVERYTHING
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawFood();

    drawSnake();
}


/* =========================
   DRAW SNAKE
========================= */

function drawSnake() {

    snake.forEach(
        (part, index) => {

            const x =
                part.x * grid;

            const y =
                part.y * grid;

            const size = grid - 4;


            /* BODY GRADIENT */

            const gradient =
                ctx.createLinearGradient(
                    x,
                    y,
                    x + size,
                    y + size
                );


            gradient.addColorStop(
                0,
                index === 0
                    ? "#ffffff"
                    : "#00ffc8"
            );

            gradient.addColorStop(
                0.5,
                "#00e6a8"
            );

            gradient.addColorStop(
                1,
                "#008f78"
            );


            ctx.fillStyle = gradient;


            /* GLOW */

            ctx.shadowBlur =
                index === 0 ? 18 : 8;

            ctx.shadowColor =
                "#00ffc8";


            roundRect(
                x + 2,
                y + 2,
                size,
                size,
                index === 0 ? 7 : 5
            );


            ctx.fill();

            ctx.shadowBlur = 0;


            /* EYES */

            if (index === 0) {

                drawEyes(
                    x,
                    y
                );
            }
        }
    );
}


/* =========================
   SNAKE EYES
========================= */

function drawEyes(x, y) {

    ctx.fillStyle = "#061016";

    let eye1;
    let eye2;


    if (direction === "RIGHT") {

        eye1 = {
            x: x + 14,
            y: y + 6
        };

        eye2 = {
            x: x + 14,
            y: y + 14
        };

    } else if (direction === "LEFT") {

        eye1 = {
            x: x + 6,
            y: y + 6
        };

        eye2 = {
            x: x + 6,
            y: y + 14
        };

    } else if (direction === "UP") {

        eye1 = {
            x: x + 6,
            y: y + 6
        };

        eye2 = {
            x: x + 14,
            y: y + 6
        };

    } else {

        eye1 = {
            x: x + 6,
            y: y + 14
        };

        eye2 = {
            x: x + 14,
            y: y + 14
        };
    }


    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        2,
        0,
        Math.PI * 2
    );

    ctx.arc(
        eye2.x,
        eye2.y,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================
   DRAW RED FOOD
========================= */

function drawFood() {

    const x =
        food.x * grid + grid / 2;

    const y =
        food.y * grid + grid / 2;


    /* RED GLOW */

    ctx.shadowBlur = 25;

    ctx.shadowColor = "#ff1744";


    /* RED GRADIENT */

    const gradient =
        ctx.createRadialGradient(
            x - 3,
            y - 3,
            2,
            x,
            y,
            9
        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        0.2,
        "#ff7085"
    );

    gradient.addColorStop(
        0.6,
        "#ff1744"
    );

    gradient.addColorStop(
        1,
        "#a50021"
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /* HIGHLIGHT */

    ctx.fillStyle = "#ffffff";

    ctx.globalAlpha = 0.8;

    ctx.beginPath();

    ctx.arc(
        x - 3,
        y - 3,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalAlpha = 1;
}


/* =========================
   ROUNDED RECTANGLE
========================= */

function roundRect(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.lineTo(
        x + width - radius,
        y
    );

    ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    ctx.lineTo(
        x + width,
        y + height - radius
    );

    ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    ctx.lineTo(
        x + radius,
        y + height
    );

    ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    ctx.lineTo(
        x,
        y + radius
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    ctx.closePath();
}


/* =========================
   CHANGE DIRECTION
========================= */

function changeDirection(newDirection) {

    if (!running) {
        return;
    }


    if (
        newDirection === "UP" &&
        direction !== "DOWN"
    ) {

        nextDirection = "UP";
    }


    if (
        newDirection === "DOWN" &&
        direction !== "UP"
    ) {

        nextDirection = "DOWN";
    }


    if (
        newDirection === "LEFT" &&
        direction !== "RIGHT"
    ) {

        nextDirection = "LEFT";
    }


    if (
        newDirection === "RIGHT" &&
        direction !== "LEFT"
    ) {

        nextDirection = "RIGHT";
    }
}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp") {

            event.preventDefault();

            changeDirection("UP");

        }

        else if (event.key === "ArrowDown") {

            event.preventDefault();

            changeDirection("DOWN");

        }

        else if (event.key === "ArrowLeft") {

            event.preventDefault();

            changeDirection("LEFT");

        }

        else if (event.key === "ArrowRight") {

            event.preventDefault();

            changeDirection("RIGHT");

        }
    }
);


/* =========================
   MOBILE CONTROLS
========================= */

document
    .querySelectorAll(".control")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                changeDirection(
                    this.dataset.direction
                );

            }
        );

    });


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    clearInterval(timer);

    finalScore.textContent = score;

    gameOver.style.display = "flex";
}


/* =========================
   PLAY AGAIN
========================= */

restartButton.addEventListener(
    "click",
    function() {

        newGame();

    }
);

</script>

</body>
</html>
