<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartCalc - Scientific Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:20px;
}

.calculator{
    width:410px;
    max-width:100%;
    background:#111827;
    padding:22px;
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
    margin-bottom:18px;
}

.top h1{
    font-size:23px;
}

.top span{
    color:#60a5fa;
}

.mode{
    background:#1f2937;
    padding:7px 10px;
    border-radius:8px;
    color:#93c5fd;
    font-size:11px;
}

.display{
    background:#020617;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    min-height:115px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:right;
}

.history{
    color:#64748b;
    min-height:22px;
    font-size:14px;
    overflow:hidden;
}

#display{
    color:white;
    font-size:31px;
    font-weight:bold;
    overflow-x:auto;
    white-space:nowrap;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:58px;
    border:none;
    border-radius:13px;
    background:#1f2937;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#374151;
    transform:translateY(-2px);
}

.function{
    background:#334155;
    color:#93c5fd;
    font-size:15px;
}

.operator{
    background:#1d4ed8;
}

.clear{
    background:#b91c1c;
}

.equal{
    background:#16a34a;
}

.zero{
    grid-column:span 2;
}

.info{
    text-align:center;
    color:#64748b;
    font-size:11px;
    margin-top:15px;
}

@media(max-width:420px){

    .calculator{
        padding:15px;
    }

    button{
        height:52px;
    }

    #display{
        font-size:27px;
    }
}

</style>
</head>


<body>

<div class="calculator">

    <div class="top">

        <h1>
            Smart<span>Calc</span>
        </h1>

        <div class="mode">
            SCIENTIFIC
        </div>

    </div>


    <!-- DISPLAY -->

    <div class="display">

        <div class="history" id="history"></div>

        <div id="display">
            0
        </div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button class="function"
        onclick="insertValue('sin')">
            sin
        </button>

        <button class="function"
        onclick="insertValue('cos')">
            cos
        </button>

        <button class="function"
        onclick="insertValue('tan')">
            tan
        </button>

        <button class="function"
        onclick="insertValue('log')">
            log
        </button>


        <button class="function"
        onclick="insertValue('√')">
            √
        </button>

        <button class="function"
        onclick="insertValue('²')">
            x²
        </button>

        <button class="function"
        onclick="insertValue('!')">
            x!
        </button>

        <button class="function"
        onclick="insertValue('π')">
            π
        </button>


        <button class="clear"
        onclick="clearDisplay()">
            AC
        </button>

        <button class="function"
        onclick="deleteLast()">
            ⌫
        </button>

        <button class="function"
        onclick="insertValue('%')">
            %
        </button>

        <button class="operator"
        onclick="insertValue('÷')">
            ÷
        </button>


        <button onclick="insertValue('7')">
            7
        </button>

        <button onclick="insertValue('8')">
            8
        </button>

        <button onclick="insertValue('9')">
            9
        </button>

        <button class="operator"
        onclick="insertValue('×')">
            ×
        </button>


        <button onclick="insertValue('4')">
            4
        </button>

        <button onclick="insertValue('5')">
            5
        </button>

        <button onclick="insertValue('6')">
            6
        </button>

        <button class="operator"
        onclick="insertValue('-')">
            −
        </button>


        <button onclick="insertValue('1')">
            1
        </button>

        <button onclick="insertValue('2')">
            2
        </button>

        <button onclick="insertValue('3')">
            3
        </button>

        <button class="operator"
        onclick="insertValue('+')">
            +
        </button>


        <button class="zero"
        onclick="insertValue('0')">
            0
        </button>

        <button onclick="insertValue('.')">
            .
        </button>

        <button class="equal"
        onclick="calculate()">
            =
        </button>


        <button class="function"
        onclick="insertValue('(')">
            (
        </button>

        <button class="function"
        onclick="insertValue(')')">
            )
        </button>

        <button class="function"
        onclick="insertValue('ln')">
            ln
        </button>

        <button class="function"
        onclick="insertValue('abs')">
            abs
        </button>

    </div>


    <div class="info">
        Smart Scientific Calculator • HTML • CSS • JavaScript
    </div>

</div>


<script>

let expression = "";

const display =
document.getElementById("display");

const history =
document.getElementById("history");


// --------------------------------
// INSERT VALUE
// --------------------------------

function insertValue(value){

    if(expression === "Error"){
        expression = "";
    }

    expression += value;

    updateDisplay();
}


// --------------------------------
// DISPLAY
// --------------------------------

function updateDisplay(){

    display.textContent =
    expression || "0";

}


// --------------------------------
// CLEAR
// --------------------------------

function clearDisplay(){

    expression = "";

    history.textContent = "";

    updateDisplay();

}


// --------------------------------
// DELETE
// --------------------------------

function deleteLast(){

    expression =
    expression.slice(0,-1);

    updateDisplay();

}


// --------------------------------
// CALCULATE
// --------------------------------

function calculate(){

    if(!expression) return;

    try{

        let result =
        evaluateExpression(expression);

        history.textContent =
        expression + " =";

        expression =
        formatResult(result);

        updateDisplay();

    }

    catch(error){

        showError();

    }

}


// --------------------------------
// SCIENTIFIC CALCULATION
// --------------------------------

function evaluateExpression(exp){

    exp = exp.trim();


    // Multiplication
    exp = exp.replaceAll("×","*");

    // Division
    exp = exp.replaceAll("÷","/");

    // Pi
    exp = exp.replaceAll("π",Math.PI);


    // Square root
    exp = exp.replace(
        /√(\d+(\.\d+)?)/g,
        "Math.sqrt($1)"
    );


    // sin
    exp = exp.replace(
        /sin(\d+(\.\d+)?)/gi,
        "Math.sin(($1)*Math.PI/180)"
    );


    // cos
    exp = exp.replace(
        /cos(\d+(\.\d+)?)/gi,
        "Math.cos(($1)*Math.PI/180)"
    );


    // tan
    exp = exp.replace(
        /tan(\d+(\.\d+)?)/gi,
        "Math.tan(($1)*Math.PI/180)"
    );


    // log
    exp = exp.replace(
        /log(\d+(\.\d+)?)/gi,
        "Math.log10($1)"
    );


    // ln
    exp = exp.replace(
        /ln(\d+(\.\d+)?)/gi,
        "Math.log($1)"
    );


    // Square
    exp = exp.replace(
        /(\d+(\.\d+)?)²/g,
        "($1*$1)"
    );


    // Percentage
    exp = exp.replace(
        /(\d+(\.\d+)?)%/g,
        "($1/100)"
    );


    // Factorial
    exp = exp.replace(
        /(\d+)!/g,
        "factorial($1)"
    );


    // Check only safe calculator characters
    if(!/^[0-9+\-*/().,\sMatha-zA-Z]+$/.test(exp)){
        throw new Error("Invalid expression");
    }


    return Function(
        "factorial",
        "return (" + exp + ")"
    )(factorial);

}


// --------------------------------
// FACTORIAL
// --------------------------------

function factorial(n){

    if(n < 0 || !Number.isInteger(n)){
        throw new Error();
    }

    let result = 1;

    for(let i=2;i<=n;i++){

        result *= i;

    }

    return result;

}


// --------------------------------
// FORMAT RESULT
// --------------------------------

function formatResult(number){

    if(!Number.isFinite(number)){
        throw new Error();
    }

    if(
        Math.abs(number) < 1e-10
    ){
        number = 0;
    }

    if(Number.isInteger(number)){
        return number.toString();
    }

    return parseFloat(
        number.toFixed(10)
    ).toString();

}


// --------------------------------
// ERROR
// --------------------------------

function showError(){

    expression = "Error";

    updateDisplay();

    setTimeout(function(){

        expression = "";

        updateDisplay();

    },1200);

}


// --------------------------------
// KEYBOARD
// --------------------------------

document.addEventListener(
"keydown",
function(event){

    const key = event.key;


    if(
        (key >= "0" && key <= "9") ||
        key === "." ||
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "(" ||
        key === ")"
    ){

        insertValue(key);

    }


    else if(
        key === "Enter" ||
        key === "="
    ){

        calculate();

    }


    else if(key === "Backspace"){

        deleteLast();

    }


    else if(key === "Escape"){

        clearDisplay();

    }

});


updateDisplay();

</script>

</body>
</html>
